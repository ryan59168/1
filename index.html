<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文學習入口</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --line: #e2e8f0;
      --blue: #2563eb;
      --rose: #e11d48;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      justify-items: center;
      align-items: start;
      padding: 34px 24px 24px;
    }

    main {
      width: min(720px, 100%);
      display: grid;
      gap: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    a {
      min-height: 146px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    a:hover {
      transform: translateY(-3px);
      border-color: #cbd5e1;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
    }

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
    }

    .practice {
      color: var(--blue);
      background: #eaf1ff;
    }

    .words {
      color: var(--rose);
      background: #fff1f4;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .go {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }

      a {
        min-height: 132px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>英文學習入口</h1>
      <p></p>
    </header>

    <section class="grid" aria-label="學習工具">
      <a href="practice.html">
        <div>
          <div class="icon practice" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
              <path d="M9 8h6"></path>
              <path d="M9 12h4"></path>
            </svg>
          </div>
          <h2>單字練習</h2>
        </div>
      </a>

      <a href="dictionary.html">
        <div>
          <div class="icon words" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v3"></path>
              <path d="M18.5 5.5 16.4 7.6"></path>
              <path d="M21 12h-3"></path>
              <path d="M5.5 5.5 7.6 7.6"></path>
              <path d="M3 12h3"></path>
              <path d="M8 17a4 4 0 0 1 8 0"></path>
              <path d="M9 21h6"></path>
            </svg>
          </div>
          <h2>AI 單字解析</h2>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
